name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # drizzle-kit loads the config (and its env schema) even for offline checks
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.9.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: bun install --frozen-lockfile
      - run: vp check
      - run: vp test
      - run: bunx drizzle-kit check
        working-directory: packages/db
